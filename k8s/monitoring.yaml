apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
- apiGroups: [""]
  resources: [configmaps,secrets,nodes,pods,services,namespaces,endpoints,persistentvolumeclaims,persistentvolumes,limitranges,resourcequotas,replicationcontrollers,serviceaccounts]
  verbs: [list,watch]
- apiGroups: [apps]
  resources: [daemonsets,deployments,replicasets,statefulsets]
  verbs: [list,watch]
- apiGroups: [batch]
  resources: [cronjobs,jobs]
  verbs: [list,watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-state-metrics}
subjects: [{kind: ServiceAccount, name: kube-state-metrics, namespace: monitoring}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
      - name: ksm
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 50m, memory: 50Mi}
          limits: {memory: 120Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector: {app: kube-state-metrics}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector: {matchLabels: {app: node-exporter}}
  template:
    metadata: {labels: {app: node-exporter}}
    spec:
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.8.2
        args: ["--path.procfs=/host/proc","--path.sysfs=/host/sys","--path.rootfs=/host/root"]
        volumeMounts:
        - {name: proc, mountPath: /host/proc, readOnly: true}
        - {name: sys,  mountPath: /host/sys,  readOnly: true}
        - {name: root, mountPath: /host/root, readOnly: true}
        ports: [{containerPort: 9100}]
        resources:
          requests: {cpu: 50m, memory: 30Mi}
          limits: {memory: 60Mi}
      volumes:
      - {name: proc, hostPath: {path: /proc}}
      - {name: sys,  hostPath: {path: /sys}}
      - {name: root, hostPath: {path: /}}
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector: {app: node-exporter}
  ports: [{port: 9100}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    rule_files: ["/etc/prometheus/rules.yml"]
    alerting:
      alertmanagers:
      - static_configs:
        - targets: ["alertmanager:9093"]
    scrape_configs:
    - job_name: prometheus
      static_configs: [{targets: ["localhost:9090"]}]
    - job_name: kube-state-metrics
      static_configs: [{targets: ["kube-state-metrics:8080"]}]
    - job_name: node
      static_configs: [{targets: ["node-exporter:9100"]}]
  rules.yml: |
    groups:
    - name: k8s-health
      rules:
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[10m]) * 600 > 3
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_available_replicas
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} wants {{ $value }} replicas mismatch"
      - alert: PodStuck
        expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Failed"}) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck Pending/Failed"
      - alert: NodeMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Node {{ $labels.instance }} has <10% memory available"
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Exporter {{ $labels.job }} is down"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.retention.time=6h
        ports: [{containerPort: 9090}]
        volumeMounts:
        - {name: config, mountPath: /etc/prometheus}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 400Mi}
      volumes:
      - name: config
        configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{port: 9090, nodePort: 30090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector: {matchLabels: {app: alertmanager}}
  template:
    metadata: {labels: {app: alertmanager}}
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
        ports: [{containerPort: 9093}]
        volumeMounts:
        - {name: config, mountPath: /etc/alertmanager, readOnly: true}
        resources:
          requests: {cpu: 20m, memory: 30Mi}
          limits: {memory: 80Mi}
      volumes:
      - name: config
        secret: {secretName: alertmanager-config}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector: {app: alertmanager}
  ports: [{port: 9093}]
